msrv = "1.96"

# OpenUSD domain vocabulary — C++ schema families, prim/API schema type names,
# and third-party formats and renderers. These appear in doc comments as prose
# nouns rather than as links to items in this crate, so `clippy::doc_markdown`
# should not ask for backticks around them. Rust identifiers stay off this list
# so the lint keeps flagging unlinked references to our own API.
doc-valid-idents = [
    "AnimMapper",
    "BlendShape",
    "DenoisePass",
    "Field3D",
    "LightAPI",
    "LightFilter",
    "LightListAPI",
    "MaterialBindingAPI",
    "MaterialX",
    "NodeDefAPI",
    "NodeGraph",
    "OmniPBR",
    "OpenUSD",
    "OpenVDB",
    "RenderMan",
    "RenderSettings",
    "ShadowAPI",
    "ShapingAPI",
    "SkelAnimation",
    "SkelBindingAPI",
    "SkelRoot",
    "SkeletonResolver",
    "SkinningResolver",
    "UsdGeom",
    "UsdGeomPrimvar",
    "UsdLux",
    "UsdMedia",
    "UsdPhysics",
    "UsdPreviewSurface",
    "UsdProc",
    "UsdRender",
    "UsdSemantics",
    "UsdShade",
    "UsdShadeInput",
    "UsdShadeOutput",
    "UsdSkel",
    "UsdUI",
    "UsdVol",
    "..",
]

# A `Stage` hashes and compares by handle identity, never by the composed state
# its cells guard, so a `Stage` (or a `Prim` holding one) is a sound map key.
ignore-interior-mutability = ["openusd::usd::Stage"]
