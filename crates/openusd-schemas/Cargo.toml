[package]
name = "openusd-schemas"
description = "Typed Rust APIs for USD's standard schemas (UsdGeom, UsdShade, UsdSkel, UsdPhysics, and more), built on openusd"
keywords = ["usd", "usdgeom", "usdphysics", "usdshade", "schemas"]
readme = "README.md"
exclude = ["/fixtures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true

# Every schema family is opt-in, so a consumer compiles only the domains it
# reads. Nothing is enabled by default.
[features]
geom = []
# UsdLux lights are UsdGeom Xformable / Boundable prims, so the lux views
# build on the geom schema traits.
lux = ["geom"]
# UsdMediaSpatialAudio is a UsdGeomXformable-derived prim, so the media views
# build on the geom schema traits.
media = ["geom"]
# UsdPhysicsJoint and the collider prims are UsdGeom Imageable / Xformable
# prims, so the physics views build on the geom schema traits.
physics = ["geom"]
# UsdProcGenerativeProcedural is a UsdGeomBoundable-derived prim, so the proc
# views build on the geom schema traits.
proc = ["geom"]
render = []
shade = []
# UsdSkelRoot and UsdSkelSkeleton are UsdGeomBoundable-derived prims, so the
# skel views build on the geom schema traits.
skel = ["geom"]
ui = []
# UsdVolVolume is a UsdGeomGprim and the field prims are UsdGeomXformable, so
# the vol views build on the geom schema traits.
vol = ["geom"]

# Feature-gated surface only renders if docs.rs turns the features on.
[package.metadata.docs.rs]
all-features = true

[build-dependencies]
# The views, the schematics and the manifest are generated from the vendored
# `schemas/` definitions at build time; see `build.rs`.
openusd-build.workspace = true

[dependencies]
openusd.workspace = true
derive_more.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The generator, so a test can read the schemas the compiled tables were
# generated from and check the tables against them.
openusd-build.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "geom"
required-features = ["geom"]

[[test]]
name = "lux"
required-features = ["lux"]

[[test]]
name = "media"
required-features = ["media"]

[[test]]
name = "physics"
required-features = ["physics"]

[[test]]
name = "proc"
required-features = ["proc"]

[[test]]
name = "render"
required-features = ["render"]

[[test]]
name = "shade"
required-features = ["shade"]

[[test]]
name = "skel"
required-features = ["skel"]

[[test]]
name = "ui"
required-features = ["ui"]

[[test]]
name = "vol"
required-features = ["vol"]
