[package]
name = "openusd-build"
description = "Generates Rust schema views from OpenUSD schema.usda files, for use as a build dependency"
keywords = ["usd", "openusd", "schema", "codegen", "build-dependencies"]
readme = "README.md"
# Test input for this repository, not for a consumer: a published crate never
# looks for it, and it carries its own upstream license.
exclude = ["/fixtures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true

[dependencies]
# A build dependency, so a consumer compiles `openusd` for the host as well as
# the target. In a dev build cargo unifies the two units and the host copy is
# free; they split when the feature sets differ, and always when
# cross-compiling.
# TODO(perf): keep this dependency's features matching what consumers enable on
# their own `openusd`, so the units keep unifying. Trimming features here to
# shrink the host build does the opposite — it forces a second unit into every
# dev build, which costs more than it saves.
openusd.workspace = true
thiserror.workspace = true

# The generated Rust is built as syntax rather than as text: `quote` writes it,
# `syn` parses it back to catch anything malformed here rather than in a
# consumer's build, and `prettyplease` lays it out without an external rustfmt.
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "printing"] }

# Prose wrapping for the documentation the generator writes. `smawk` lays a
# paragraph out so its lines come out even, rather than filling each one as far
# as it goes and leaving the last short; `unicode-width` measures a column as a
# reader sees it, so the mathematics `usdLux` writes is counted by its letters
# rather than by its bytes. No other default feature is wanted: the rest read a
# terminal's width, which a doc comment does not have.
textwrap = { version = "0.16", default-features = false, features = ["smawk", "unicode-width"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
