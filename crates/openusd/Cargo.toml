[package]
name = "openusd"
description = "Rust native USD library"
keywords = ["usd", "usda", "usdc", "usdz", "pxr"]
readme = "README.md"
exclude = ["/fixtures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true

[features]
default = ["mmap"]
# A file asset can be served from a read-only memory mapping of it, which
# `ar::DefaultResolver::map_files` opts into; the feature compiles the
# capability and nothing maps without the opt-in.
mmap = ["dep:memmap2"]
serde = ["dep:serde", "half/serde"]

# Feature-gated surface only renders if docs.rs turns the features on.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bitflags.workspace = true
bytemuck.workspace = true
derive_more.workspace = true
half.workspace = true
logos = "0.16.0"
lz4_flex = "0.14.0"
memmap2 = { version = "0.9", optional = true }
num-traits.workspace = true
regex-lite = "0.1.9"
serde = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
diff_json.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "text_format"
required-features = ["serde"]

[[test]]
name = "text_writer_roundtrip"
required-features = ["serde"]

[[test]]
name = "binary_writer_roundtrip"
required-features = ["serde"]

[[test]]
name = "cross_format_roundtrip"
required-features = ["serde"]
